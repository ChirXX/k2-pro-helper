name: Собрать APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Установить зависимости и синхронизировать
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/debug/app-debug.apk K2-Pro-Pomoshnik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: K2-Pro-Pomoshnik-apk
          path: K2-Pro-Pomoshnik.apk

      - name: Опубликовать как релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: K2 Pro Помощник v1.0.${{ github.run_number }}
          files: K2-Pro-Pomoshnik.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
