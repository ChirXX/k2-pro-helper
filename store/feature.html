<!DOCTYPE html>
<!-- Баннер 1024×500 для Google Play -->
<html lang="ru"><head><meta charset="UTF-8"><style>
html,body{margin:0;width:1024px;height:500px;overflow:hidden;font-family:Roboto,"Noto Sans",sans-serif}
.wrap{position:relative;width:1024px;height:500px;background:radial-gradient(70% 90% at 95% 10%,rgba(255,143,82,.35),transparent 60%),radial-gradient(60% 70% at 0 100%,rgba(140,200,255,.15),transparent 60%),#15131A;color:#F4EFE9;display:flex;align-items:center;padding:0 72px;box-sizing:border-box;gap:48px}
.ic{width:200px;height:200px;flex:none;border-radius:46px;overflow:hidden;box-shadow:0 18px 50px rgba(255,122,61,.45)}
.ic iframe{border:0;width:512px;height:512px;transform:scale(.390625);transform-origin:0 0}
h1{margin:0;font-size:76px;font-weight:900;letter-spacing:-2px;line-height:1}
p{margin:18px 0 26px;font-size:30px;color:#D6CFD8;line-height:1.3;max-width:600px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chips span{background:#2A2631;border:2px solid #37323F;border-radius:999px;padding:8px 18px;font-size:21px;font-weight:700}
.chips span.on{background:#FF8F52;border-color:#FF8F52;color:#2A1408}
.layers{position:absolute;right:-40px;bottom:-30px;opacity:.13}
.layers i{display:block;height:22px;border-radius:11px;background:#FF8F52;margin-top:10px}
</style></head><body><div class="wrap">
<div class="layers"><i style="width:260px"></i><i style="width:380px"></i><i style="width:380px"></i></div>
<div class="ic"><iframe src="icon.html"></iframe></div>
<div><h1>3D Помощник</h1><p>Карманный справочник по 3D-печати: найди проблему — получи решение</p>
<div class="chips"><span class="on">Проблемы</span><span>Принтеры</span><span>Пластики</span><span>Видео</span></div></div>
</div></body></html>
